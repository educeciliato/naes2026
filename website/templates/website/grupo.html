{% extends "website/modelo.html" %} {% block titulo %}Grupos{% endblock %} {%
block conteudo %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h5 class="mb-0">Grupos de Usuários</h5>
  <a href="{% url 'grp_novo' %}" class="btn btn-primary btn-sm">+ Novo</a>
</div>

<div class="card">
  <table>
    <thead>
      <tr>
        <th>Nome</th>
        <th>Membros</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody>
      {% for g in grupos %}
      <tr>
        <td>{{ g.name }}</td>
        <td>{{ g.user_set.count }}</td>
        <td>
          <a href="{% url 'grp_editar' g.pk %}" class="btn btn-sm btn-secondary"
            >Editar</a
          >
          <a href="{% url 'grp_excluir' g.pk %}" class="btn btn-sm btn-danger"
            >Excluir</a
          >
        </td>
      </tr>
      {% empty %}
      <tr>
        <td colspan="3" class="text-center text-muted py-3">
          Nenhum grupo cadastrado.
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
