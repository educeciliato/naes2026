{% extends "website/modelo.html" %}
{% load crispy_forms_tags %}

{% block titulo %}Alterar Senha — PharmaSys{% endblock %}

{% block breadcrumb %}
  <li class="breadcrumb-item active">Alterar Senha</li>
{% endblock %}

{% block conteudo %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm border-0">
      <div class="card-header bg-gradient-primary py-3">
        <h4 class="mb-0 text-center text-white stencil" style="font-size:1.4rem;">
          <i class="bi bi-key me-2"></i>Alterar Senha
        </h4>
      </div>
      <div class="card-body p-4">
        <form method="POST">
          {% csrf_token %}
          {{ form|crispy }}
          <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn btn-primary px-4">
              <i class="bi bi-check-circle me-2"></i>Salvar nova senha
            </button>
            <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary px-4">
              <i class="bi bi-x-circle me-2"></i>Cancelar
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
