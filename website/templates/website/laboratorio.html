{% extends "website/modelo.html" %} {% block titulo %}Laboratórios{% endblock %}
{% block conteudo %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h5 class="mb-0">Laboratórios</h5>
  <a href="{% url 'lab_novo' %}" class="btn btn-primary btn-sm">+ Novo</a>
</div>

<div class="card">
  <table>
    <thead>
      <tr>
        <th>Nome</th>
        <th>Ativo</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody>
      {% for l in labs %}
      <tr>
        <td>{{ l.nome }}</td>
        <td>{% if l.ativo %}✅{% else %}❌{% endif %}</td>
        <td>
          <a href="{% url 'lab_editar' l.pk %}" class="btn btn-sm btn-secondary"
            >Editar</a
          >
          <a href="{% url 'lab_excluir' l.pk %}" class="btn btn-sm btn-danger"
            >Excluir</a
          >
        </td>
      </tr>
      {% empty %}
      <tr>
        <td colspan="3" class="text-center text-muted py-3">
          Nenhum laboratório cadastrado.
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
