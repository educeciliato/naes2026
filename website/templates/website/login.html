{% extends "website/modelo.html" %} {% block titulo %}Login{% endblock %} {%
block conteudo %}
<div class="login-box">
  <div class="card">
    <div class="card-header">💊 PharmaSys — Entrar</div>
    <div class="p-4">
      {% if messages %} {% for msg in messages %}
      <div class="msg-err">{{ msg }}</div>
      {% endfor %} {% endif %}
      <form method="POST" action="{% url 'login' %}">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label">Usuário</label>
          <input
            type="text"
            name="username"
            class="form-control"
            required
            autofocus
          />
        </div>
        <div class="mb-3">
          <label class="form-label">Senha</label>
          <input
            type="password"
            name="password"
            class="form-control"
            required
          />
        </div>
        <button type="submit" class="btn btn-primary w-100">Entrar</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
