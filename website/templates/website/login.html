{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — PharmaSys</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=Saira:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{% static 'css/pharma.css' %}">
  <style>
    body {
      padding-top: 0;
      background: linear-gradient(135deg, #0c3740 0%, #1B6B7B 60%, #2d8fa2 100%);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
    }
  </style>
</head>
<body>
<div class="login-box">
  <div class="text-center mb-4">
    <i class="bi bi-capsule-pill text-white" style="font-size:2.5rem"></i>
    <h2 class="text-white mt-2 stencil">PharmaSys</h2>
    <p class="text-white-50" style="font-size:.9rem">Sistema de Gestão de Farmácia</p>
  </div>

  <div class="card shadow-lg border-0">
    <div class="card-body p-4">
      <h5 class="stencil text-center mb-4" style="color:var(--clr-primary)">Entrar na conta</h5>

      {% if messages %}
        {% for msg in messages %}
        <div class="alert alert-danger d-flex align-items-center gap-2 py-2" role="alert">
          <i class="bi bi-exclamation-circle"></i>{{ msg }}
        </div>
        {% endfor %}
      {% endif %}

      <form method="POST" action="{% url 'login' %}">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label" for="username">Usuário</label>
          <div class="input-group">
            <span class="input-group-text" style="border-color:var(--clr-border)">
              <i class="bi bi-person" style="color:var(--clr-muted)"></i>
            </span>
            <input type="text" id="username" name="username" class="form-control"
                   placeholder="seu usuário" required autofocus />
          </div>
        </div>
        <div class="mb-4">
          <label class="form-label" for="password">Senha</label>
          <div class="input-group">
            <span class="input-group-text" style="border-color:var(--clr-border)">
              <i class="bi bi-lock" style="color:var(--clr-muted)"></i>
            </span>
            <input type="password" id="password" name="password" class="form-control"
                   placeholder="••••••••" required />
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-100 fw-semibold">
          <i class="bi bi-box-arrow-in-right me-2"></i>Entrar
        </button>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
